# Monitors
source = ./monitor.conf

# Variables
var = mainMod, ALT
var = mainShf, $mainMod+SHIFT
var = mainCtl, $mainMod+CTRL
var = CFG, ~/.config
var = BIN, ~/.config/bin
var = CURSOR, plan9cursors
var = terminal, alacritty
var = fileManager, pcmanfm
var = menu, rofi -show drun

# Environment Variables
env = XCURSOR_SIZE, 24
env = XCURSOR_THEME, plan9cursors
env = NO_AT_BRIDGE, 1
env = QT_PLATFORMTHEME, gtk3
env = QT_QPA_PLATFORMTHEME, gtk3
env = QT_PLATFORM_PLUGIN, gtk3

# Autostart
exec_once = $BIN/wal refresh
exec_once = $BIN/bar refresh
exec_once = $BIN/mon launch
exec_once = $BIN/watcher/wtchr
exec_once = systemctl --user import-environment WAYLAND_DISPLAY
exec_once = systemctl --user start gnome-keyring-daemon
exec_once = cclipd -s 2 -t "image/png" -t "image/*" -t "text/plain;charset=utf-8" -t "text/*" -t "*"
exec_once = gsettings set org.gnome.desktop.interface gtk-theme "paradise"
exec_once = gsettings set org.gnome.desktop.wm.preferences theme "paradise"

# Styles
blur = 0
shadows = 0
animations=0

border_radius = 3
no_radius_when_single = 0

focused_opacity = 1.0
unfocused_opacity = 1.0

dim_enable=1
dim_focused_color=0x00000000
dim_unfocused_color=0x00000067

# Overview Setting
hotarea_size=10
enable_hotarea=0
hotarea_disable_on_fullscreen=1
overview_gap_inner=5
overview_gap_outer=30
overcircle_center_ratio=0.5
title_message_bar_height=52
title_message_bar_gap=20

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
idle_inhibit_when_fullscreen=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_direction_only_zone_overlap=1
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
float_full_to_top=0
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
trackpad_accel_profile=1
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse
mouse_natural_scrolling = 0
mouse_accel_profile = 1

# Appearance
gap_inner_horizontal = 1
gap_inner_vertical = 1
gap_outer_horizontal = 2
gap_outer_vertical = 2
border_px=0
root_color=0x201b14ff
border_color=0x444444ff
drop_color=0x8FBA7C55
split_color=0xEB441EFF
focus_color=0xc9b890ff
maximized_screen_color=0x89aa61ff
urgent_color=0xad401fff
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
scratchpad_color=0x516c93ff
global_color=0xb153a7ff
overlay_color=0x14a57cff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tag_rule=id:1,layout_name:tile
tag_rule=id:2,layout_name:tile
tag_rule=id:3,layout_name:tile
tag_rule=id:4,layout_name:tile
tag_rule=id:5,layout_name:tile
tag_rule=id:6,layout_name:tile
tag_rule=id:7,layout_name:tile
tag_rule=id:8,layout_name:tile
tag_rule=id:9,layout_name:tile

# Master layout
new_is_master=0
smart_gaps=0
default_master_factor=0.5
default_master_count=1
tag_num=9
tag_gather=0

# Key Bindings
bind = $mainMod, Q, spawn, $BIN/kc-mango
bind = $mainMod, E, spawn, $fileManager
bind = $mainMod, SPACE, spawn, $menu
bind = $mainMod, RETURN, spawn, $terminal
bind = $mainMod, W, togglefloating,
bind = $mainMod, F, togglefullscreen,
bind = $mainShf, F, togglefakefullscreen,
bind = $mainMod, V, spawn, $BIN/clip
bind = $mainShf, W, spawn, $BIN/wal menu
bind = $mainShf, C, spawn, hyprpicker -a
bind = $mainMod, O, spawn, $BIN/vol switch
bind = $mainShf, O, spawn, $BIN/mon menu
bind = $mainShf, R, spawn, $BIN/bar refresh
bind = $mainMod, P, spawn, $BIN/shot-mango screen
bind = $mainShf, P, spawn, $BIN/shot-mango window
bind = $mainMod, SLASH, spawn, $BIN/emoji
bind = $mainShf, DELETE, quit
bind = $mainMod, R, reload_config

bind = $mainMod, h, focusdir, left
bind = $mainMod, l, focusdir, right
bind = $mainMod, j, focusdir, down
bind = $mainMod, k, focusdir, up

# bind = ALT+SHIFT, j, exchange_stack_client,next
# bind = ALT+SHIFT, k, exchange_stack_client,prev
bind = $mainShf, h, move_client, left
bind = $mainShf, l, move_client, right
bind = $mainShf, j, move_client, down
bind = $mainShf, k, move_client, up
bind = $mainMod, Tab, togglejump,

bind = $mainMod, 1, view, 1, 0
bind = $mainMod, 2, view, 2, 0
bind = $mainMod, 3, view, 3, 0
bind = $mainMod, 4, view, 4, 0
bind = $mainMod, 5, view, 5, 0
bind = $mainMod, 6, view, 6, 0
bind = $mainMod, 7, view, 7, 0
bind = $mainMod, 8, view, 8, 0
bind = $mainMod, 9, view, 9, 0

bind = $mainShf, 1, tag, 1, 0
bind = $mainShf, 2, tag, 2, 0
bind = $mainShf, 3, tag, 3, 0
bind = $mainShf, 4, tag, 4, 0
bind = $mainShf, 5, tag, 5, 0
bind = $mainShf, 6, tag, 6, 0
bind = $mainShf, 7, tag, 7, 0
bind = $mainShf, 8, tag, 8, 0
bind = $mainShf, 9, tag, 9, 0

bind = $mainCtl, h, resizewin, -50, 0
bind = $mainCtl, l, resizewin, +50, 0
bind = $mainCtl, j, resizewin, 0, +50
bind = $mainCtl, k, resizewin, 0, -50

bind = CTRL+SHIFT,Up,movewin,+0,-50
bind = CTRL+SHIFT,Down,movewin,+0,+50
bind = CTRL+SHIFT,Left,movewin,-50,+0
bind = CTRL+SHIFT,Right,movewin,+50,+0

mousebind = $mainMod, btn_left, moveresize, curmove
mousebind = $mainMod, btn_right, moveresize, curresize

gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview

bind = $mainMod, M, spawn, $BIN/vol mute
bind = $mainMod, COMMA, spawn, $BIN/vol down
bind = $mainMod, PERIOD, spawn, $BIN/vol up
bind = NONE, XF86AudioRaiseVolume, spawn, wpctl set-volume @DEFAULT_SINK@ 5%+
bind = NONE, XF86AudioLowerVolume, spawn, wpctl set-volume @DEFAULT_SINK@ 5%-
bind = NONE, XF86AudioMute, spawn, wpctl set-mute @DEFAULT_SINK@ toggle
bind = NONE, XF86MonBrightnessUp, spawn, brightnessctl s +5%
bind = NONE, XF86MonBrightnessDown, spawn, brightnessctl s 5%-

bind = NONE, XF86AudioNext, spawn, playerctl next
bind = NONE, XF86AudioPrev, spawn, playerctl previous
bind = NONE, XF86AudioPlay, spawn, playerctl play-pause

# Rules
window_rule = is_floating:1, app_id:imv
window_rule = is_floating:1, app_id:org.pulseaudio.pavucontrol
window_rule = is_floating:1, app_id:org.gnome.FileRoller
window_rule = is_floating:1, app_id:org.gnome.gThumb
window_rule = is_floating:1, app_id:engrampa
window_rule = is_floating:1, app_id:xarchiver
window_rule = is_floating:1, app_id:nwg-look
window_rule = is_floating:1, title:Save File
window_rule = is_floating:1, title:.*Properties

layer_rule = animation_type_open:zoom, layer_name:tofi
layer_rule = animation_type_close:zoom, layer_name:tofi
